<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <link rel="stylesheet" href="bai5-1.css">
</head>
<body>
  <h2>span → inline-block</h2>
  <span class="sp">Span 1</span><span class="sp">Span 2</span><span class="sp">Span 3</span>
  <h2>div → inline (cùng một hàng)</h2>
  <div class="dv">Div 1</div><div class="dv">Div 2</div><div class="dv">Div 3</div>
  <h2>display: none và visibility: hidden</h2>
  <div class="box a">Hộp A</div>
  <div class="box b">Hộp B (display: none - biến mất, không chiếm chỗ)</div>
  <div class="box c">Hộp C (visibility: hidden - ẩn nhưng vẫn chiếm chỗ)</div>
  <div class="box d">Hộp D</div>
</body>
</html>
