<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid: đặt vị trí item</title>
  <link rel="stylesheet" href="bai6-6.css">
</head>
<body>
  <div class="luoi">
    <div class="a">A (grid-column: 1 / 3)</div>
    <div class="b">B (grid-row: 1 / 3)</div>
    <div class="c">C (span 2)</div>
    <div class="d">D</div>
  </div>
  <p class="giai-thich">Lưới 3 cột có 4 đường dọc đánh số 1, 2, 3, 4. "1 / 3" nghĩa là từ đường 1 đến đường 3, tức chiếm 2 cột.
  Tương tự "1 / 3" của grid-row là chiếm 2 hàng.</p>
</body>
</html>
