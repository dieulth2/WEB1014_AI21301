<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector id và class</title>
  <link rel="stylesheet" href="bai2-5.css">
</head>
<body>
  <p id="intro" class="note">Đoạn giới thiệu: dùng #intro, đồng thời class .note.</p>
  <p class="note">Ghi chú 1 (.note)</p>
  <p class="note">Ghi chú 2 (.note)</p>
  <p class="warning">Cảnh báo 1 (.warning)</p>
  <p class="warning note">Vừa cảnh báo vừa ghi chú (2 class)</p>
  <p>Đoạn bình thường không class.</p>
</body>
</html>
