<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ba cách viết CSS</title>
  <link rel="stylesheet" href="style-ngoai.css">
  <style>
  h1 { color: green; }
  </style>
</head>
<body>
  <h1 style="color: red;">Tiêu đề (inline CSS: đỏ)</h1>
  <p>Ba cách cùng đổi màu h1: inline màu đỏ, internal màu xanh lá, external màu xanh dương.
  Kết quả hiển thị là <strong>đỏ</strong> vì inline CSS có độ ưu tiên cao nhất.</p>
</body>
</html>
