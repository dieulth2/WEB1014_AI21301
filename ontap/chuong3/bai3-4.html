<body>
  <h1>Cùng một màu cam, 5 cách viết</h1>
  <div class="luoi">
    <div class="o c1">Tên màu<br>orange</div>
    <div class="o c2">Hex<br>#ffa500</div>
    <div class="o c3">rgb()<br>rgb(255,165,0)</div>
    <div class="o c4">rgba() 50%<br>rgba(255,165,0,0.5)</div>
    <div class="o c5">hsl()<br>hsl(39,100%,50%)</div>

  </div>
