<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 6 - Bài 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="back" href="index.html">&larr; Mục lục</a>
    <div class="services">
      <h2>Dịch vụ của chúng tôi</h2>
      <div class="service-list">
        <div class="service">
          <div class="icon">&#128187;</div>
          <h3>Thiết kế web</h3>
          <p>Giao diện đẹp, hiển thị tốt trên mọi thiết bị.</p>
        </div>
        <div class="service">
          <div class="icon">&#128640;</div>
          <h3>Tối ưu tốc độ</h3>
          <p>Trang web tải nhanh, trải nghiệm mượt mà.</p>
        </div>
        <div class="service">
          <div class="icon">&#128295;</div>
          <h3>Bảo trì</h3>
          <p>Hỗ trợ cập nhật và sửa lỗi thường xuyên.</p>
        </div>
      </div>
    </div>
    <div class="form-login">
      <form class="login">
        <h2>Đăng nhập</h2>
        <div class="field">
          <label for="user">Tên đăng nhập</label>
          <input type="text" id="user" placeholder="Nhập tên đăng nhập" />
        </div>
        <div class="field">
          <label for="pass">Mật khẩu</label>
          <input type="password" id="pass" placeholder="Nhập mật khẩu" />
        </div>
        <button type="submit">Đăng nhập</button>
      </form>
    </div>
  </body>
</html>
